<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-header {
            background: linear-gradient(135deg, #0A1929 0%, #1E3A8A 100%);
            padding: 30px 0;
            text-align: center;
            color: #FFFFFF;
        }
        .admin-header h1 { font-size: 2rem; }
        .admin-table {
            width: 100%;
            background: #FFFFFF;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .admin-table th {
            background: #0A1929;
            color: #FFFFFF;
            padding: 12px;
            font-size: 0.85rem;
        }
        .admin-table td {
            padding: 8px;
            border-bottom: 1px solid #E2E8F0;
            font-size: 0.85rem;
        }
        .admin-table input, .admin-table select {
            width: 100%;
            padding: 6px;
            border: 1px solid #E2E8F0;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .btn-save {
            background: #25D366;
            color: #FFF;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-delete {
            background: #DC143C;
            color: #FFF;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-add {
            background: #3B82F6;
            color: #FFF;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: inline-block;
        }
        .btn-add:hover { background: #2563EB; }
        .btn-save:hover { background: #20BA5A; }
        .btn-delete:hover { background: #B22222; }
        .success-msg {
            background: #25D366;
            color: #FFF;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            display: none;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .add-form {
            background: #FFFFFF;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: none;
            margin-bottom: 30px;
        }
        .add-form h3 { margin-bottom: 20px; color: #0A1929; }
        .add-form input, .add-form select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #E2E8F0;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .add-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .product-count {
            text-align: center;
            color: #64748B;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .upload-status {
            font-size: 0.85rem;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .image-preview {
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: none;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 2px solid #E2E8F0;
        }
        @media screen and (max-width: 768px) {
            .admin-table { font-size: 0.7rem; }
            .admin-table th, .admin-table td { padding: 5px; }
            .add-form .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Password Protection -->
    <script>
        if (!sessionStorage.getItem('admin-auth')) {
            const password = prompt("🔐 Enter Admin Password:");
            if (password !== "jojo2026") {
                alert("❌ Access Denied!");
                window.location.href = "index.html";
            } else {
                sessionStorage.setItem('admin-auth', 'true');
            }
        }
    </script>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-text">JOJO</span>
                <span class="logo-text-light">ELECTRONIC</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="products.html" class="nav-link">Products</a></li>
                <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
                <li class="nav-item"><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>

    <!-- Header -->
    <section class="admin-header">
        <h1>🛠️ Admin Panel</h1>
        <p>Manage Products - Add, Edit, Delete</p>
    </section>

    <!-- Main Content -->
    <section style="padding: 40px 0; background: #F8FAFC;">
        <div class="container">
            <div class="success-msg" id="successMsg"></div>
            
            <!-- Product Count -->
            <p class="product-count" id="productCount"></p>
            
            <!-- Add New Product Button -->
            <button class="btn-add" onclick="toggleForm()">
                <i class="fas fa-plus-circle"></i> Add New Product
            </button>
            
            <!-- Add New Product Form -->
            <div class="add-form" id="addForm">
                <h3>➕ Add New Product</h3>
                <div class="form-row">
                    <input type="text" id="newName" placeholder="Product Name *" required>
                    <input type="text" id="newCategory" placeholder="Category *" required>
                </div>
                <div class="form-row">
                    <input type="number" id="newPrice" placeholder="Price (Rs.) *" required>
                    <div>
                        <input type="file" id="newImageFile" accept="image/*" onchange="handleImageUpload()" style="margin-bottom: 5px;">
                        <div class="upload-status" id="uploadStatus"></div>
                        <input type="hidden" id="newImage" value="">
                        <img class="image-preview" id="imagePreview" alt="Preview">
                    </div>
                </div>
                <input type="text" id="newDesc" placeholder="Description (features)">
                <div style="display: flex; gap: 10px;">
                    <button class="btn-save" onclick="addProduct()" style="flex: 1; padding: 12px;">
                        <i class="fas fa-save"></i> Save Product
                    </button>
                    <button class="btn-delete" onclick="toggleForm()" style="flex: 1; padding: 12px; background: #64748B;">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                </div>
            </div>
            
            <!-- Products Table -->
            <table class="admin-table" id="adminTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Price (Rs.)</th>
                        <th>In Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminBody"></tbody>
            </table>
        </div>
    </section>

    <script src="js/products.js"></script>
    
    <!-- Cloudinary Image Upload -->
    <script>
        // Cloudinary Configuration
        const CLOUD_NAME = "doirkhmlv";
        const UPLOAD_PRESET = "jojo-electronics";
        
        // Handle image upload to Cloudinary
        function handleImageUpload() {
            const file = document.getElementById('newImageFile').files[0];
            if (!file) return;
            
            // Show preview
            const preview = document.getElementById('imagePreview');
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
            
            // Show uploading status
            const statusEl = document.getElementById('uploadStatus');
            statusEl.textContent = '⏳ Uploading image...';
            statusEl.style.color = '#3B82F6';
            
            // Upload to Cloudinary
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            
            fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.secure_url) {
                    document.getElementById('newImage').value = data.secure_url;
                    statusEl.textContent = '✅ Image uploaded successfully!';
                    statusEl.style.color = '#25D366';
                } else {
                    statusEl.textContent = '❌ Upload failed. Try again.';
                    statusEl.style.color = '#DC143C';
                }
            })
            .catch(error => {
                statusEl.textContent = '❌ Upload failed. Try again.';
                statusEl.style.color = '#DC143C';
            });
        }
    </script>
    
    <!-- Admin Panel Logic -->
    <script>
        const adminBody = document.getElementById('adminBody');
        const successMsg = document.getElementById('successMsg');
        const productCount = document.getElementById('productCount');
        
        // Show success message
        function showMessage(text) {
            successMsg.textContent = text;
            successMsg.style.display = 'block';
            setTimeout(() => { successMsg.style.display = 'none'; }, 2500);
        }
        
        // Toggle add form
        function toggleForm() {
            const form = document.getElementById('addForm');
            form.style.display = form.style.display === 'block' ? 'none' : 'block';
            // Reset upload fields
            document.getElementById('uploadStatus').textContent = '';
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('newImage').value = '';
            document.getElementById('newImageFile').value = '';
        }
        
        // Add new product
        function addProduct() {
            const name = document.getElementById('newName').value.trim();
            const category = document.getElementById('newCategory').value.trim();
            const price = parseInt(document.getElementById('newPrice').value);
            const image = document.getElementById('newImage').value.trim();
            const desc = document.getElementById('newDesc').value.trim();
            
            if (!name || !category || !price) {
                alert('❌ Please fill all required fields (*)');
                return;
            }
            
            if (!image) {
                alert('❌ Please upload an image first.');
                return;
            }
            
            const newProduct = {
                id: products.length + 1,
                name: name,
                category: category,
                price: price,
                image: image,
                description: desc || 'New product',
                inStock: true
            };
            
            products.push(newProduct);
            saveProducts();
            
            // Clear form
            document.getElementById('newName').value = '';
            document.getElementById('newCategory').value = '';
            document.getElementById('newPrice').value = '';
            document.getElementById('newImage').value = '';
            document.getElementById('newDesc').value = '';
            document.getElementById('newImageFile').value = '';
            document.getElementById('uploadStatus').textContent = '';
            document.getElementById('imagePreview').style.display = 'none';
            
            toggleForm();
            renderAdminTable();
            showMessage('✅ New product added successfully!');
        }
        
        // Save product edits
        function saveProduct(index) {
            const newPrice = parseInt(document.getElementById(`price-${index}`).value);
            const newStock = document.getElementById(`stock-${index}`).value === 'true';
            
            products[index].price = newPrice;
            products[index].inStock = newStock;
            
            saveProducts();
            showMessage('✅ Changes saved successfully!');
        }
        
        // Delete product
        function deleteProduct(index) {
            if (confirm(`⚠️ Delete "${products[index].name}"? This cannot be undone.`)) {
                products.splice(index, 1);
                saveProducts();
                renderAdminTable();
                showMessage('🗑️ Product deleted successfully!');
            }
        }
        
        // Render admin table
        function renderAdminTable() {
            adminBody.innerHTML = '';
            productCount.textContent = `📦 Total Products: ${products.length}`;
            
            products.forEach((product, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${product.id}</td>
                    <td><strong>${product.name}</strong></td>
                    <td>${product.category}</td>
                    <td><input type="number" id="price-${index}" value="${product.price}" style="width: 80px;"></td>
                    <td>
                        <select id="stock-${index}">
                            <option value="true" ${product.inStock ? 'selected' : ''}>✅ In Stock</option>
                            <option value="false" ${!product.inStock ? 'selected' : ''}>❌ Out</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-save" onclick="saveProduct(${index})">💾 Save</button>
                        <button class="btn-delete" onclick="deleteProduct(${index})">🗑️</button>
                    </td>
                `;
                adminBody.appendChild(row);
            });
        }
        
        // Initial render
        renderAdminTable();
    </script>

    <!-- Reveal on Scroll -->
    <script>
        function revealOnScroll() {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(element => {
                const windowHeight = window.innerHeight;
                const elementTop = element.getBoundingClientRect().top;
                const revealPoint = 150;
                if (elementTop < windowHeight - revealPoint) {
                    element.classList.add('active');
                }
            });
        }
        window.addEventListener('scroll', revealOnScroll);
        window.addEventListener('load', revealOnScroll);
    </script>
